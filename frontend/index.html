<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EmergentCTI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <meta name="color-scheme" content="light dark" />
    <!-- Appearance boot: resolve System/Light/Dark before first paint.
         Mirrors src/lib/appearance.ts (verified by appearance.test.ts). -->
    <script id="appearance-boot">
      (function () {
        var pref = 'system';
        try {
          var s = localStorage.getItem('emergentcti.appearance');
          if (s === 'system' || s === 'light' || s === 'dark') {
            pref = s;
          } else {
            var legacy = localStorage.getItem('theme');
            if (legacy === 'light' || legacy === 'dark') {
              pref = legacy;
              localStorage.setItem('emergentcti.appearance', legacy);
              localStorage.removeItem('theme');
            }
          }
        } catch (e) {}
        var dark = pref === 'dark' ||
          (pref === 'system' && !!window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        var root = document.documentElement;
        root.classList.toggle('dark', dark);
        root.style.colorScheme = dark ? 'dark' : 'light';
        root.dataset.appearance = pref;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
